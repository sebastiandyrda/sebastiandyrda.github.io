name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets the deploy job publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # publications.bib -> _generated/*.md happens in Quarto's pre-render hook,
      # which shells out to python3.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render site
        run: quarto render

      - name: Fail if the publication list came out empty
        run: |
          test -s _generated/research.md || { echo "research.md is empty"; exit 1; }
          test -s _generated/discussions.md || { echo "discussions.md is empty"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
