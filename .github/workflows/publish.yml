name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets the deploy job publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the CV's "last updated" date is read from the
          # commit that last touched the PDF, and a shallow clone has none.
          fetch-depth: 0

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Must run BEFORE quarto render, not only via the pre-render hook:
      # Quarto resolves {{< include >}} while enumerating project files, which
      # happens before pre-render, so on a fresh checkout _generated/ would not
      # exist yet and the include would fail.
      - name: Generate publication lists from publications.bib
        run: python3 _scripts/build_pubs.py

      - name: Render site
        run: quarto render

      - name: Fail if the publication list came out empty
        run: |
          test -s _generated/research.md || { echo "research.md is empty"; exit 1; }
          test -s _generated/discussions.md || { echo "discussions.md is empty"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
